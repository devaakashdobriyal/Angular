<h2>Add New Action Figure</h2>

<input [(ngModel)]="name" placeholder="Figure Name" />
<br><br>

<input [(ngModel)]="series" placeholder="Series" />
<br><br>

<input [(ngModel)]="price" type="number" placeholder="Price" />
<br><br>

<input [(ngModel)]="imageUrl" placeholder="Image URL" />
<br><br>

<button (click)="saveFigure()">Save</button>
